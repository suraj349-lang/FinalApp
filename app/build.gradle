plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'


}

android {
    namespace 'com.spint.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.spint.app"
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName "1.1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.0')
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2025.11.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'com.google.firebase:firebase-auth-ktx:23.2.1'
    implementation 'androidx.media3:media3-common:1.9.0-alpha01'
    implementation 'com.google.firebase:firebase-storage:22.0.1'
    implementation 'androidx.security:security-crypto-ktx:1.1.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.compose.ui:ui:1.9.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.11.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.6.8'

    // navigation
    implementation 'androidx.navigation:navigation-compose:2.9.5'

    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.16'
    implementation('com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.16')


    // Dagger - Hilt
    implementation 'com.google.dagger:hilt-android:2.56.2'
    kapt 'com.google.dagger:hilt-android-compiler:2.56.2'
    kapt 'androidx.hilt:hilt-compiler:1.3.0'
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'

    // Room components
    implementation('androidx.room:room-runtime:2.8.3')
    kapt 'androidx.room:room-compiler:2.8.3'
    implementation('androidx.room:room-ktx:2.8.3')

    // DataStore Preferences
    implementation('androidx.datastore:datastore-preferences:1.1.7')

    //location
    implementation "com.google.android.gms:play-services-location:21.3.0"

    //socket io
    implementation('io.socket:socket.io-client:2.1.2') {
        exclude group: 'org.json', module: 'json'
    }

    //serialization

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'

    //firebase FCM
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation("com.google.firebase:firebase-core:21.1.1")

    //coil
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation "com.github.bumptech.glide:compose:1.0.0-beta01"


    // Compose
    implementation 'androidx.compose.material:material:1.9.4'


    // Splash API
    implementation 'androidx.core:core-splashscreen:1.2.0-rc01'



    // Pager and Indicators - Accompanist
    implementation 'com.google.accompanist:accompanist-pager:0.36.0'
    implementation 'com.google.accompanist:accompanist-pager-indicators:0.36.0'

    //places
    implementation 'com.google.android.libraries.places:places:5.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'

    //qr
    implementation 'com.google.zxing:core:3.5.3'

    // qr scanning (static)
   // implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    implementation 'com.google.accompanist:accompanist-pager:0.36.0'

    //Paging 3.0
    implementation 'androidx.paging:paging-compose:3.4.0-alpha04'

    // Swipe refresh
    implementation 'com.google.accompanist:accompanist-swiperefresh:0.36.0'

    //image cropper
    implementation("com.github.CanHub:Android-Image-Cropper:4.0.0")
    // CameraX dependencies
    implementation('androidx.camera:camera-camera2:1.5.1')
    implementation('androidx.camera:camera-lifecycle:1.5.1')
    implementation('androidx.camera:camera-view:1.5.1')
    implementation('androidx.camera:camera-core:1.5.1')
    implementation('androidx.camera:camera-extensions:1.5.1')

    //qr scanning
    implementation ("com.google.mlkit:barcode-scanning:17.3.0")

    //
    implementation 'com.google.accompanist:accompanist-systemuicontroller:0.36.0'


   // exoplayer
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'

    //webrtc

    implementation('io.getstream:stream-webrtc-android:1.3.8')

    //remote config





}